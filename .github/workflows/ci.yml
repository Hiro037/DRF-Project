name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies with Poetry
      run: |
        poetry install

    - name: Debug environment variables
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        echo "SECRET_KEY is set: ${SECRET_KEY:+set}"

    - name: Run migrations
      env:
        DJANGO_SETTINGS_MODULE: config.settings_ci
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: poetry run python manage.py migrate

    - name: Run tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings_ci
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out code
      uses: actions/checkout@v3
      
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Add server to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Copy project files to server
      run: |
        rsync -avz --exclude '__pycache__' . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}


    - name: Install dependencies on server with Poetry
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}

          sudo apt update || true
          sudo apt install -y python3.12-venv
          rm -rf venv
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install poetry
          poetry install --no-root --only main
        EOF

    - name: Collect static files
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          source venv/bin/activate
          python3 manage.py collectstatic --noinput
        EOF
