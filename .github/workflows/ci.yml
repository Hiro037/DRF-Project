name: Django CI/CD Pipeline

on:
  push:
    branches: [ develop, homework-35-2 ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Configure Poetry (no virtualenv)
      run: |
        poetry config virtualenvs.create false

    - name: Install dependencies with Poetry
      run: |
        poetry install --no-interaction --no-root

    - name: Run tests with SQLite
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: 1
      run: |
        poetry run python manage.py test --settings=config.settings_ci

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker images
      run: |
        poetry run docker-compose -f docker-compose.yml build

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: success()

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Copy project files to server
      run: |
        rsync -avz --delete \
          --exclude '__pycache__' \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '.idea' \
          --exclude 'venv' \
          --exclude 'htmlcov' \
          --exclude 'media' \
          --exclude 'staticfiles' \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_DIR }}

    - name: Copy environment file to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        EOF

    - name: Deploy with Docker Compose
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          # Останавливаем текущие контейнеры
          sudo docker-compose down
          # Пересобираем и запускаем в фоновом режиме
          sudo docker-compose up --build -d
          # Выполняем миграции
          sudo docker-compose exec -T web python manage.py migrate --noinput
          # Собираем статические файлы
          sudo docker-compose exec -T web python manage.py collectstatic --noinput
        EOF

    - name: Verify deployment
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          echo "=== Status of containers ==="
          sudo docker-compose ps
          echo "=== Recent logs ==="
          sudo docker-compose logs --tail=20
        EOF